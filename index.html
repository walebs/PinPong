  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0c0c0f;
      --surface: #17171c;
      --s2:      #202028;
      --border:  #2a2a35;
      --text:    #f0f0f5;
      --muted:   #606070;
      --blue:    #3B8BFF;
      --orange:  #FF6B00;
      --purple:  #7C3AED;
      --green:   #34C759;
      --yellow:  #FFD60A;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: var(--bg);
      overflow: hidden;
      height: 100dvh; width: 100dvw;
      color: var(--text);
    }
    #map { position: fixed; inset: 0; z-index: 0; }
    .header {
      position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 400;
      padding: env(safe-area-inset-top, 0px) 0 0;
      width: fit-content;
    }
    .header-inner {
      margin: 12px 0 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.5);
      width: fit-content;
    }
    .header-top { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 40px; height: 40px; background: var(--orange);
      border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .logo-text { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.4px; }
    .logo-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .progress-bar-track { flex: 1; height: 4px; background: var(--s2); border-radius: 2px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.6s ease; }
    .progress-label { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .filter-row { display: flex; gap: 8px; margin-top: 10px; }
    .filter-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--s2);
      font-size: 12.5px; font-weight: 600; color: #888;
      cursor: pointer; transition: all 0.15s; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-pill.active-outdoor { border-color: var(--orange); background: rgba(255,107,0,0.12); color: var(--orange); }
    .filter-pill.active-bar     { border-color: var(--purple); background: rgba(124,58,237,0.12); color: var(--purple); }
    .filter-dot { width: 7px; height: 7px; border-radius: 50%; }
    .fab-stack {
      position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); z-index: 300;
      display: flex; flex-direction: row; gap: 10px; align-items: center;
    }
    .fab-nearest {
      display: flex; align-items: center; gap: 8px;
      padding: 13px 18px; background: var(--blue); color: white;
      border: none; border-radius: 28px; font-size: 13.5px; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 24px rgba(59,139,255,0.4);
      transition: transform 0.12s, opacity 0.12s;
      -webkit-tap-highlight-color: transparent; letter-spacing: -0.2px;
    }
    .fab-nearest:active { transform: scale(0.95); opacity: 0.85; }
    .fab-locate {
      width: 50px; height: 50px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 50%;
      cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s; -webkit-tap-highlight-color: transparent;
    }
    .fab-locate:active { transform: scale(0.92); }
    .bottom-sheet {
      position: fixed; bottom: 24px; left: 50%; z-index: 500;
      width: calc(100% - 32px); max-width: 400px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 24px; box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      transform: translate(-50%, calc(100% + 40px));
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      overflow: hidden;
      will-change: transform;
    }
    @media (max-width: 480px) {
      .sheet-photo { height: 130px; }
      .sheet-body { padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
      .sheet-type { font-size: 10px; margin-bottom: 2px; }
      .sheet-name { font-size: 17px; margin-bottom: 6px; }
      .sheet-stats { gap: 4px; margin-bottom: 8px; }
      .stat-row { font-size: 12px; }
      .sheet-notes { margin-bottom: 10px; }
      .sheet-notes-label { font-size: 10px; margin-bottom: 4px; }
      .sheet-notes-bullet { font-size: 12px; margin-bottom: 2px; }
      .btn-directions { padding: 11px; font-size: 13px; }
    }
    .bottom-sheet.open { transform: translate(-50%, 0); }
    .sheet-close-top {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(0,0,0,0.82); border: 1.5px solid rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #fff; backdrop-filter: blur(6px);
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .sheet-close-top:active { background: rgba(0,0,0,0.95); }
    .search-wrap {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 150px);
      left: 50%; transform: translateX(-50%); z-index: 399;
      width: 280px;
    }
    .search-input {
      width: 100%; padding: 10px 16px 10px 38px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; color: var(--text); font-size: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); outline: none;
      -webkit-appearance: none;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: var(--muted);
    }
    .search-field { position: relative; }
    .search-results {
      margin-top: 6px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .search-result-item {
      padding: 11px 14px; cursor: pointer; font-size: 13px;
      color: var(--text); display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border);
      -webkit-tap-highlight-color: transparent;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:active { background: var(--s2); }
    .sheet-photo { width: 100%; height: 220px; object-fit: cover; display: none; background: var(--s2); }
    .sheet-photo.visible { display: block; }
    .sheet-body { padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
    .sheet-type { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 4px; }
    .sheet-name { font-size: 21px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; line-height: 1.15; margin-bottom: 12px; }
    .sheet-stats { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .stat-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #bbb;
    }
    .stat-row .stat-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
    .stat-row .stat-key { color: var(--muted); flex-shrink: 0; }
    .stat-row .stat-val { font-weight: 600; color: var(--text); }
    .stat-row.verified .stat-val  { color: var(--green); }
    .stat-row.not-found .stat-val { color: #FF3B30; }
    .sheet-notes { margin-bottom: 16px; }
    .sheet-notes-label { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .sheet-notes-bullet { display: flex; align-items: flex-start; gap: 7px; font-size: 13px; color: var(--muted); line-height: 1.4; margin-bottom: 4px; }
    .sheet-notes-bullet::before { content: "•"; color: var(--muted); flex-shrink: 0; }
    .sheet-actions { display: flex; gap: 10px; }
    .btn-directions {
      flex: 1; padding: 14px; background: var(--blue); color: white;
      border: none; border-radius: 14px; font-size: 14.5px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 8px; transition: opacity 0.12s; -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 16px rgba(59,139,255,0.35);
    }
    .btn-directions:active { opacity: 0.8; }
    .btn-close {
      width: 52px; height: 52px; background: var(--s2);
      border: 1px solid var(--border); border-radius: 14px;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; color: #777; -webkit-tap-highlight-color: transparent;
    }
    .btn-close:active { background: var(--border); }
    .leaflet-tile-pane { filter: brightness(1.35) contrast(1.05) saturate(0.5); }
    .leaflet-control-zoom { display: none !important; }
    .zoom-btns {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; z-index: 400;
      display: flex; flex-direction: column; gap: 6px;
    }
    .zoom-btn {
      width: 40px; height: 40px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-size: 20px; font-weight: 300;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      transition: background 0.12s; -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .zoom-btn:active { background: var(--s2); }
    .cluster-icon {
      width: 30px; height: 30px; background: #FF6B00;
      border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      box-shadow: 0 3px 14px rgba(255,107,0,0.5);
    }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background: none !important; }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background: none !important; }
    .leaflet-control-attribution {
      background: rgba(12,12,15,0.75) !important; color: #555 !important;
      font-size: 10px !important; border-radius: 8px 0 0 0 !important;
    }
    .leaflet-control-attribution a { color: #555 !important; }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.5; }
      100% { transform: scale(2.4); opacity: 0; }
    }

</head>

function parseCSVLine(line) {
  const vals = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
    else { cur += c; }
  }
  vals.push(cur.trim());
  return vals;
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());
  return lines.slice(1).map(line => {
    const vals = parseCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || "").trim());
    return obj;
  });
}

function resolveImage(url) {
  if (!url) return "";
  if (url.includes('imgur.com')) {
    // Trekk ut Imgur-ID — alltid siste alfanumeriske segment
    const m = url.match(/([a-zA-Z0-9]+)(?:\?.*)?$/);
    if (m) return `https://i.imgur.com/${m[1]}.jpg`;
  }
  // Full URL → bruk direkte
  if (url.startsWith("http")) return url;
  // Bare filnavn → hent fra images/bord/-mappen
  return `images/bord/${url}`;
}

async function loadSheetData() {
  if (!SHEETS_CSV_URL) {
    updateProgress();
    document.getElementById('logoMeta').textContent = `${TABLES.length} steder`;
    return;
  }
  try {
    const res = await fetch(SHEETS_CSV_URL);
    const text = await res.text();
    const rows = parseCSV(text);
    rows.forEach(row => {
      const navn = (row.navn || "").trim();
      if (!navn) return;
      const lat = parseFloat(row.lat), lng = parseFloat(row.lng);
      const data = {
        verifisert: row.verifisert ? row.verifisert.toLowerCase() : null,
        label:      row.label || null,
        antall:     row.antall    || null,
        materiale:  row.materiale || null,
        tilstand:   row.tilstand  || null,
        under_tak:  row.under_tak || null,
        belysning:  row.belysning || null,
        notater:    row.notater   || "",
        bilde_url:  (row.url || row.bilde_url) ? resolveImage(row.url || row.bilde_url) : "",
      };
      // Match by name first, then by proximity (~100m)
      let existing = TABLES.findIndex(t => t.navn.toLowerCase() === navn.toLowerCase());
      if (existing === -1 && lat && lng) {
        existing = TABLES.findIndex(t => Math.abs(t.lat - lat) + Math.abs(t.lng - lng) < 0.001);
      }
      if (existing !== -1) {
        // Sheet is source of truth — update name too
        TABLES[existing] = { ...TABLES[existing], navn, ...data };
      } else {
        if (!lat || !lng) return;
        const rawType = (row.type||"utendørs").toLowerCase();
        const type = rawType === "utendørs" ? "outdoor" : rawType === "innendørs" ? "bar" : rawType;
        TABLES.push({ navn, lat, lng, type, ...data });
      }
    });
    updateProgress();
    renderMarkers();
  } catch(e) {
    console.warn("Sheet-feil:", e);
    document.getElementById('logoMeta').textContent = `${TABLES.length} steder`;
    updateProgress();
  }
}

function updateProgress() {
  const verified = TABLES.filter(t => t.verifisert === "ja").length;
  const total = TABLES.length;
  document.getElementById('progressFill').style.width = Math.round((verified/total)*100) + "%";
  document.getElementById('progressLabel').textContent = `${verified} / ${total} verifisert`;
  document.getElementById('logoMeta').textContent = `${total} steder`;
  document.getElementById('progressRow').style.display = verified > 0 ? 'flex' : 'none';
}

const map = L.map('map', { center:[59.926,10.752], zoom:13, zoomControl:false, attributionControl:true, tap:true, preferCanvas:true, zoomSnap:0.5, zoomDelta:0.5 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a>',
  maxZoom:19, subdomains:'abcd',
}).addTo(map);

function iconSize(highlighted=false) {
  return highlighted ? 36 : 28;
}

function makeIcon(t, highlighted=false) {
  const color = t.type==='outdoor' ? '#FF6B00' : '#7C3AED';
  const size  = iconSize(highlighted);
  const glow  = highlighted ? `filter:drop-shadow(0 0 8px ${color}99);` : '';
  const opacity = t.verifisert==="nei" ? 0.35 : 1;
  const pulse = highlighted ? `<div style="position:absolute;top:50%;left:50%;width:${size}px;height:${size}px;margin:-${size/2}px 0 0 -${size/2}px;border-radius:50%;background:${color};opacity:0.35;animation:pulse 1.3s ease-out infinite;pointer-events:none;"></div>` : '';
  const icon = t.type==='outdoor'
    ? `<svg width="${Math.round(size*.42)}" height="${Math.round(size*.42)}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><ellipse cx="10" cy="10" rx="8" ry="8" fill="white" opacity="0.92"/><rect x="15" y="14" width="3" height="7" rx="1.5" fill="white" opacity="0.92" transform="rotate(-40 15 14)"/></svg>`
    : `<svg width="${Math.round(size*.42)}" height="${Math.round(size*.42)}" viewBox="0 0 24 24" fill="white" opacity="0.92" xmlns="http://www.w3.org/2000/svg"><path d="M5 3h14v9a7 7 0 01-14 0V3z"/><rect x="11" y="19" width="2" height="4" rx="1"/></svg>`;
  const cs = Math.max(12, Math.round(size * 0.48));
  const offset = -Math.round(cs * 0.45);
  const checkmark = t.verifisert==="ja" ? `<div style="position:absolute;top:${offset}px;right:${offset}px;width:${cs}px;height:${cs}px;background:#34C759;border:2.5px solid #0c0c0f;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.5);"><svg width="${Math.round(cs*0.52)}" height="${Math.round(cs*0.52)}" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>` : '';
  const html = `<div style="position:relative;display:flex;flex-direction:column;align-items:center;${glow}opacity:${opacity}">${pulse}<div style="position:relative;width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2.5px solid rgba(255,255,255,0.15);box-shadow:0 3px 12px ${color}55;display:flex;align-items:center;justify-content:center;">${icon}${checkmark}</div><div style="width:2px;height:6px;background:${color};opacity:0.8;margin-top:-1px;border-radius:0 0 2px 2px;"></div></div>`;
  return L.divIcon({ html, className:'', iconSize:[size,size+7], iconAnchor:[size/2,size+7] });
}

let showOutdoor=true, showBar=true, leafletMarkers=[], userMarker=null, selectedIdx=null, clusterGroup=null, clusterGroupBar=null;

function makeClusterGroup(color) {
  return L.markerClusterGroup({
    iconCreateFunction: cluster => {
      const count = cluster.getChildCount();
      return L.divIcon({
        html: `<div class="cluster-icon" style="background:${color};box-shadow:0 3px 14px ${color}80">${count}</div>`,
        className: '', iconSize: [30, 30], iconAnchor: [15, 15]
      });
    },
    maxClusterRadius: 60,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    disableClusteringAtZoom: 15,
    animate: true,
    spiderfyOnMaxZoom: true,
  });
}

function renderMarkers() {
  if (clusterGroup)    map.removeLayer(clusterGroup);
  if (clusterGroupBar) map.removeLayer(clusterGroupBar);
  leafletMarkers = [];
  clusterGroup    = makeClusterGroup('#FF6B00');
  clusterGroupBar = makeClusterGroup('#7C3AED');
  TABLES.forEach((t, i) => {
    if (t.type==='outdoor' && !showOutdoor) return;
    if (t.type==='bar'     && !showBar)     return;
    const lm = L.marker([t.lat,t.lng], { icon:makeIcon(t) });
    lm._tableIndex = i;
    lm.on('click', e => { L.DomEvent.stopPropagation(e); openSheet(i); });
    leafletMarkers.push({ lm, index:i });
    if (t.type === 'outdoor') clusterGroup.addLayer(lm);
    else                      clusterGroupBar.addLayer(lm);
  });
  map.addLayer(clusterGroup);
  map.addLayer(clusterGroupBar);
}

renderMarkers();
loadSheetData();

// Auto-locate on first visit
const geoOpts = { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 };
navigator.geolocation && navigator.geolocation.getCurrentPosition(pos => {
  userLat = pos.coords.latitude;
  userLng = pos.coords.longitude;
  setUserMarker(userLat, userLng);
  map.flyTo([userLat, userLng], 14, { duration: 1.2 });
}, () => {}, geoOpts);

function openSheet(idx) {
  const t = TABLES[idx];
  selectedIdx = idx;
  const photo = document.getElementById('sheetPhoto');
  if (t.bilde_url) {
    photo.src = t.bilde_url;
    photo.className = 'sheet-photo visible';
    photo.onerror = () => { photo.className = 'sheet-photo'; };
  } else {
    photo.src = ''; photo.className = 'sheet-photo';
  }
  document.getElementById('sheetType').textContent = t.type==='outdoor' ? '🏓 Utebord' : `🍺 ${t.label || 'Innendørs'}`;
  document.getElementById('sheetType').style.color = t.type==='outdoor' ? 'var(--orange)' : 'var(--purple)';
  document.getElementById('sheetName').textContent = t.navn;
  const stats = document.getElementById('sheetStats');
  stats.innerHTML = '';
  if (t.verifisert==='ja')
    stats.innerHTML += `<div class="stat-row verified"><span class="stat-icon">✅</span><span class="stat-key">Verifisert:</span><span class="stat-val">Ja</span></div>`;
  else if (t.verifisert==='nei')
    stats.innerHTML += `<div class="stat-row not-found"><span class="stat-icon">❌</span><span class="stat-key">Verifisert:</span><span class="stat-val">Ikke funnet</span></div>`;
  else
    stats.innerHTML += `<div class="stat-row"><span class="stat-icon">⏳</span><span class="stat-key">Status:</span><span class="stat-val">Ikke besøkt ennå</span></div>`;
  if (t.antall)    stats.innerHTML += `<div class="stat-row"><span class="stat-icon">🏓</span><span class="stat-key">Antall:</span><span class="stat-val">${esc(t.antall)}</span></div>`;
  if (t.tilstand)  stats.innerHTML += `<div class="stat-row"><span class="stat-icon">⭐</span><span class="stat-key">Tilstand:</span><span class="stat-val">${esc(t.tilstand)}</span></div>`;
  if (t.belysning) stats.innerHTML += `<div class="stat-row"><span class="stat-icon">💡</span><span class="stat-key">Belysning:</span><span class="stat-val">${esc(t.belysning)}</span></div>`;
  const notesEl = document.getElementById('sheetNote');
  notesEl.innerHTML = '';
  if (t.notater) {
    const lines = t.notater.split(/[.\n]/).filter(l => l.trim());
    if (lines.length) {
      notesEl.innerHTML = `<div class="sheet-notes-label">Notater</div>`;
      lines.forEach(line => {
        notesEl.innerHTML += `<div class="sheet-notes-bullet">${esc(line.trim())}</div>`;
      });
    }
  }
  const sheet = document.getElementById('bottomSheet');
  const alreadyOpen = sheet.classList.contains('open');
  sheet.classList.add('open');
  leafletMarkers.forEach(({ lm, index }) => lm.setIcon(makeIcon(TABLES[index], index===idx)));
  if (!alreadyOpen) {
    map.panTo([t.lat, t.lng], { animate:true, duration:0.35 });
  } else {
    map.panTo([t.lat, t.lng], { animate:true, duration:0.2 });
  }
}

function closeSheet() {
  document.getElementById('bottomSheet').classList.remove('open');
  leafletMarkers.forEach(({ lm, index }) => lm.setIcon(makeIcon(TABLES[index], false)));
  selectedIdx = null;
}

map.on('click', closeSheet);
let zoomTimer;
map.on('zoom', () => {
  clearTimeout(zoomTimer);
  zoomTimer = setTimeout(() => {
    leafletMarkers.forEach(({ lm, index }) => lm.setIcon(makeIcon(TABLES[index], index === selectedIdx)));
  }, 80);
});

function openDirections() {
  if (selectedIdx===null) return;
  const { lat, lng } = TABLES[selectedIdx];
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS) window.open(`maps://maps.apple.com/?daddr=${lat},${lng}&dirflg=w`);
  else       window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`);
}

let userLat=null, userLng=null;

function setUserMarker(lat, lng) {
  if (userMarker) map.removeLayer(userMarker);
  const icon = L.divIcon({
    html:`<div style="width:14px;height:14px;background:#34C759;border:2.5px solid rgba(255,255,255,0.9);border-radius:50%;box-shadow:0 0 0 4px rgba(52,199,89,0.25)"></div>`,
    className:'', iconSize:[14,14], iconAnchor:[7,7],
  });
  userMarker = L.marker([lat,lng], { icon, zIndexOffset:1000 }).addTo(map);
}

function locateMe() {
  if (!navigator.geolocation) return alert('Geolokasjon støttes ikke.');
  navigator.geolocation.getCurrentPosition(pos => {
    userLat=pos.coords.latitude; userLng=pos.coords.longitude;
    setUserMarker(userLat,userLng);
    map.flyTo([userLat,userLng], 15, { duration:1 });
  }, () => alert('Kunne ikke hente posisjon.'), geoOpts);
}

function haversine(la1,ln1,la2,ln2) {
  const R=6371e3, φ1=la1*Math.PI/180, φ2=la2*Math.PI/180;
  const Δφ=(la2-la1)*Math.PI/180, Δλ=(ln2-ln1)*Math.PI/180;
  const a=Math.sin(Δφ/2)**2+Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function findNearest() {
  if (!navigator.geolocation) return alert('Geolokasjon støttes ikke.');
  const btn = document.getElementById('btnNearest');
  btn.style.opacity='0.55';
  navigator.geolocation.getCurrentPosition(pos => {
    btn.style.opacity='1';
    userLat=pos.coords.latitude; userLng=pos.coords.longitude;
    setUserMarker(userLat,userLng);
    let nearestIdx=null, minDist=Infinity;
    TABLES.forEach((t,i) => {
      if (t.type==='outdoor' && !showOutdoor) return;
      if (t.type==='bar'     && !showBar)     return;
      if (t.verifisert==='nei') return;
      const d=haversine(userLat,userLng,t.lat,t.lng);
      if (d<minDist) { minDist=d; nearestIdx=i; }
    });
    if (nearestIdx!==null) {
      const dist=minDist<1000 ? `${Math.round(minDist)} m unna` : `${(minDist/1000).toFixed(1)} km unna`;
      map.flyTo([TABLES[nearestIdx].lat,TABLES[nearestIdx].lng], 15, { duration:1.1 });
      setTimeout(() => {
        openSheet(nearestIdx);
        const n=document.getElementById('sheetNote');
        n.textContent=(n.textContent?n.textContent+'  ·  ':'')+' 📍 '+dist;
      }, 700);
    }
  }, () => { btn.style.opacity='1'; alert('Kunne ikke hente posisjon.'); }, geoOpts);
}

function fuzzyScore(name, q) {
  name = name.toLowerCase();
  if (name.includes(q)) return 100 + (100 - name.indexOf(q));
  let j = 0;
  for (let i = 0; i < name.length && j < q.length; i++) {
    if (name[i] === q[j]) j++;
  }
  return j === q.length ? j : 0;
}

const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = TABLES
    .map((t, i) => ({ t, i, score: fuzzyScore(t.navn, q) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.innerHTML = matches.map(({ t, i }) =>
    `<div class="search-result-item" onclick="selectSearch(${i})">
      <span style="font-size:10px;color:${t.type==='outdoor'?'var(--orange)':'var(--purple)'}">●</span>
      <span>${esc(t.navn)}</span>
    </div>`
  ).join('');
  searchResults.style.display = 'block';
});

function selectSearch(idx) {
  searchInput.value = '';
  searchResults.style.display = 'none';
  searchInput.blur();
  map.flyTo([TABLES[idx].lat, TABLES[idx].lng], 16, { duration: 0.8 });
  setTimeout(() => openSheet(idx), 600);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchResults.style.display = 'none';
});

function toggleFilter(type) {
  if (type==='outdoor') {
    showOutdoor=!showOutdoor;
    const p=document.getElementById('pill-outdoor');
    p.className='filter-pill'+(showOutdoor?' active-outdoor':'');
    p.style.opacity=showOutdoor?'1':'0.4';
  } else {
    showBar=!showBar;
    const p=document.getElementById('pill-bar');
    p.className='filter-pill'+(showBar?' active-bar':'');
    p.style.opacity=showBar?'1':'0.4';
  }
  renderMarkers(); closeSheet();
}
</script>
